<!-- Critical inline styles: the first paint must already BE the intro screen.
     Without this the browser paints ~300ms of empty page before React mounts
     the loader, which reads as a flash on every reload. -->
<style>
  html { background: #c9f31d; }
  html.is-live { background: #fdfbf5; }
  #boot {
    position: fixed; inset: 0; z-index: 9999;
    background: #c9f31d;
    display: grid; place-items: center;
  }
  #boot::before {
    content: ""; position: absolute; inset: -20%;
    background-image: radial-gradient(#14110f 1.6px, transparent 1.7px);
    background-size: 13px 13px; opacity: .16;
  }
  #boot span {
    font-family: Archivo, "Arial Black", system-ui, sans-serif;
    font-weight: 900; font-size: clamp(5rem, 20vmin, 13rem);
    letter-spacing: -.06em; color: #fdfbf5;
    -webkit-text-stroke: 4px #14110f; paint-order: stroke fill;
  }
</style>
</head>
<body>
<div id="root">
  <!-- Replaced by React on mount. Matches the loader's first frame exactly so
       the handover is invisible. -->
  <div id="boot"><span>SA</span></div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
